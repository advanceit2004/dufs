# dufs starter config — generated by `dufs --gen-config`
# Usage: dufs --config config.yaml

# The folder to serve
serve-path: '.'
# Listen port
port: 5000
# Enable upload, delete, search, archive (restrict per user below)
allow-all: true

auth:
  # Users listed here can open the permission-management overview in the web UI.
  # This only controls UI visibility of permission metadata, not file access.
  admins:
    - admin

  users:
    # Full administrator: read-write everywhere.
    admin:
      password: 'CHANGE-ME'
      paths:
        - '/:rw'

    # Sub-folder manager: can fully manage the listed folders, but the
    # root stays index-only (no uploads, deletes, or new folders at root).
    portaladmin:
      password: 'CHANGE-ME'
      paths:
        - '/ProjectA:rw'
        - '/ProjectB:rw'
      # groups: [team]
      # roles: [editor]

  # Groups grant shared paths/roles to their members.
  groups: {}
  #  team:
  #    members: [portaladmin]
  #    paths: ['/shared:rw']

  # Roles are named permission sets assignable to users or groups.
  roles: {}
  #  editor:
  #    description: 'Can edit team files'
  #    paths: ['/team:rw']
